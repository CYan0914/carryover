# XcodeGen spec. `xcodegen generate` writes Carryover.xcodeproj from this file.
#
# The project file is generated rather than committed, so this file is the
# single source of truth for every build setting.
name: Carryover
options:
  bundleIdPrefix: com.cyan0914
  deploymentTarget:
    iOS: "17.0"
  minimumXcodeGenVersion: 2.40
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    ALWAYS_SEARCH_USER_PATHS: NO
    DEVELOPMENT_TEAM: H4VQ9X6KYK
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

    # No INFOPLIST_KEY_* settings: GENERATE_INFOPLIST_FILE is NO below and the
    # target points at an explicit file, so those keys would be silently
    # dropped. Every Info.plist entry lives in Resources/Info.plist.
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  Carryover:
    type: application
    platform: iOS
    sources:
      - path: CarryoverApp.swift
      - path: Core
      - path: Models
      - path: Services
      - path: Views
      - path: Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: Carryover
        PRODUCT_BUNDLE_IDENTIFIER: com.cyan0914.carryover
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Ship an Apple Watch companion later; for now iPhone and iPad only.
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  CarryoverTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Carryover
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyan0914.carryover.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Carryover:
    build:
      targets:
        Carryover: all
        CarryoverTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CarryoverTests
    archive:
      config: Release
